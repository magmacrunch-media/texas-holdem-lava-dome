# The host tests need nothing but a C compiler, so they run on a GitHub-hosted
# runner rather than the dev box. These are the tests that must still run when
# that machine is off — tying them to it would undo the point of having them.
#
# One checkout: this game's tests link only its own sources, so the engine is
# not needed here the way it is in Moonlight Drift's workflow.
#
# The devkitPPC build below does need the engine, so that job checks out both,
# the way Moonlight Drift's workflow does. It needs no particular machine:
# devkitPro publish the toolchain as a container that runs on a hosted runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be run against a branch without opening a pull request first.
  workflow_dispatch:

jobs:
  host-tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The hand evaluator classifies all 2,598,960 five-card hands and checks
      # the ten totals against the published frequencies, so this job is doing
      # real work rather than a smoke test — and still finishes in seconds.
      - name: make test
        working-directory: wii
        run: make test

  # The rules and the evaluator in the terminal port's Python, with no engine
  # installed. Two things make this the important job:
  #
  # lavadome/cards.py through betting.py claim to import nothing outside the
  # standard library, and running them here with only pytest on the machine is
  # what proves it.
  #
  # And this is where the differential test lives — the Python evaluator run
  # against the real JavaScript over thousands of hands. It needs node, not
  # the engine. The web build has no test suite of its own, so this is the only
  # thing standing in for one.
  wii-build:
    name: wii build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      # Checked out into a subdirectory so the engine can sit beside it. That is
      # the layout the Makefile documents and a flat clone produces, so `make`
      # resolves the engine through its own first default candidate rather than
      # a MAGNOLIA= override this job would have to keep correct.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: texas-holdem-lava-dome

      # Tracks main rather than a pinned ref, deliberately. An engine change
      # that breaks this game should redden this repo on the day it lands.
      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # GRRLIB is not a dkp-pacman package - it is built from source into the
      # portlibs tree, and its own dependencies arrive with the image's
      # ppc-portlibs and wii-portlibs groups. Pinned, so an upstream commit
      # cannot turn this red on a day nobody touched it; v4.6.1 is what
      # magnolia's own CI installs.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        working-directory: texas-holdem-lava-dome/wii
        run: make

      - name: The .dol exists
        run: test -f texas-holdem-lava-dome/wii/build/texas-holdem-lava-dome.dol

  tui-rules:
    name: tui rules (no engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: pip install pytest ruff

      # The published arcade evaluator, for the differential test to compare
      # against. There is one checkout here, so the vendored bundle in the
      # website repo is not on disk — and the published package is the better
      # reference anyway, being what actually ships.
      - name: Install the JavaScript evaluator
        working-directory: tui/tools
        run: npm ci

      - name: Confirm the oracle loaded
        working-directory: tui/tools
        run: node js_oracle.mjs --check

      # LAVADOME_REQUIRE_ORACLE turns a missing oracle into a failure instead of
      # letting the differential tests skip and report green — the same guard
      # texastoast's conftest applied to a missing display.
      - name: Rules and evaluator, with no engine on the machine
        working-directory: tui
        env:
          LAVADOME_REQUIRE_ORACLE: "1"
        run: python -m pytest tests/test_rules.py tests/test_handeval.py -q

      - name: Lint
        working-directory: tui
        run: ruff check .

  # The screens, which do need the engine and its terminal backend.
  tui-screens:
    name: tui screens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # magmacrunch comes from pyproject.toml and is on PyPI, so there is
      # nothing to install by hand. It carries the engine and, through it,
      # textual and rich.
      - name: Install the game
        working-directory: tui
        run: pip install -e ".[dev]"

      - name: Screens
        working-directory: tui
        run: python -m pytest tests/test_app.py -q
