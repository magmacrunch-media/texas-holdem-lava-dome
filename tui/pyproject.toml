[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Prefixed for the same reason as magmacrunch-george-boole: PyPI has no
# scoping like the npm @magmacrunch/… packages, and `adenosine` and `magnolia`
# are both already taken there by other people. See ../../george-boole/tui/
# PACKAGING.md for the plan this belongs to.
name = "magmacrunch-thld"
version = "0.5.0"
description = "Texas Hold'Em Lava Dome — terminal version"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [{ name = "magmacrunch media" }]

# The engine, with its terminal backend. lavadome/cards.py, handeval.py,
# config.py, state.py, dome.py, betting.py and dealer.py depend on neither and
# are importable on their own.
#
# 0.5.0 is the floor because `GameInfo.score_key` is new in it, and this game
# is the reason that field exists - see lavadome/arcade.py. Against an older
# engine the dataclass rejects the argument outright, so the entry point
# raises on load and the arcade reports this cabinet as broken rather than
# seating it. A floor that lets that happen is not a floor.
# 0.7.0 is where magmacrunch.engine.ui.glyphs arrives, and this game imports
# it in run(). The bound has to be 0.7.0 rather than 0.6.0 even though 0.6.0
# is the version the module was written against: 0.6.0 was already published,
# without it. Pinned a release too low, the install succeeds and the game dies
# on launch -- which is the worst place to learn about a pin, and the reason
# this bound exists at all.
dependencies = ["magmacrunch>=0.7.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
lava-dome = "lavadome.__main__:main"

# Found by a launcher enumerating installed games. Declaring it costs nothing
# when the game is run on its own — see magmacrunch.engine.arcade.
[project.entry-points."magmacrunch.games"]
thld = "lavadome.arcade:GAME"

[tool.hatch.build.targets.wheel]
packages = ["lavadome"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
